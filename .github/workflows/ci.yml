name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        go-version: ["1.22", "stable"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}

      - run: make deps
      - run: test -z "$(gofmt -l .)"
      - run: make lint
      - run: make build
      - run: go test -race ./...

  # Stable check name for branch protection, regardless of the matrix.
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - run: echo "all matrix jobs passed"
